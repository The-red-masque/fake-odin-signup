<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Emilys+Candy&family=Poppins:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Fake Service Sign-up</title>
  </head>
  <body>
    <aside>
      <h1>
        <img
          alt="The Odin Project Logo"
          src="odin-lined.png"
          width="10%"
          height="auto"
        />Fake Service
      </h1>
      Photo by
      <a
        href="https://unsplash.com/@onurbinay?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
        >Onur Binay</a
      >
      on
      <a
        href="https://unsplash.com/photos/a-black-robot-vacuum-on-a-wooden-floor-uhJgh4FHi6I?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
        >Unsplash</a
      >
    </aside>

    <p>
      This is not a real online Service! You know you need something like this
      in your life to help you realize your deepest dreams.<br />Sign up now to
      get started.
    </p>
    <p>You <em>know</em> you want to.</p>

    <form>
      <legend>Let's do this!</legend>
      <!-- Name -->
      <fieldset>
        <label for="first_name">First Name:</label>
        <input
          type="text"
          id="first_name"
          name="first_name"
          placeholder="John"
          required
        />
        <label for="last_name">Last Name:</label>
        <input
          type="text"
          id="last_name"
          name="last_name"
          placeholder="Doe"
          required
        />
      </fieldset>
      <!-- Contact -->
      <fieldset>
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="name@website.com"
          required
        />
        <label for="phone_number">Phone Number:</label>
        <input
          type="tel"
          id="phone_number"
          name="phone_number"
          placeholder="(555) 555-5555"
          required
        />
      </fieldset>
      <fieldset>
        <!-- Password -->
        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="pwd" required />
        <label for="pwd">Confirm Password:</label>
        <input type="password" id="pwd1" name="pwd1" required />
        <!-- /^((?=\S*?[A-Z])(?=\S*?[a-z])(?=\S*?[0-9]).{6,})\S$/ -->
      </fieldset>
      <button type="submit">Create Account</button>
    </form>
    <!-- <button type="submit">Create Account</button> -->
    <p>
      Already have an account?
      <a
        href="https://www.theodinproject.com/lessons/node-path-intermediate-html-and-css-sign-up-form"
        >Log in</a
      >
    </p>
  </body>
</html>
