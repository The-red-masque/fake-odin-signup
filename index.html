<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake Service Sign-up</title>
  </head>
  <body>
    <aside>
      <!-- <p>bg image of aside</p> -->
      <h1>Logo and branding</h1>
    </aside>
    <div>
      <p>
        This is not a real online Service! You know you need something like this
        in your life to help you realize your deepest dreams.<br />Sign up now
        to get started.
      </p>
      <p>You <em>know</em> you want to.</p>
    </div>
    <form>
      <p>Let's do this!</p>
      <!-- Name -->
      <fieldset>
        <label for="first_name">First Name:</label>
        <input
          type="text"
          id="first_name"
          name="first_name"
          placeholder="John"
        />
        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" name="last_name" placeholder="Doe" />
      </fieldset>
      <!-- Contact -->
      <fieldset>
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="name@website.com"
        />
        <label for="phone_number">Phone Number:</label>
        <input
          type="tel"
          id="phone_number"
          name="phone_number"
          placeholder="(555) 555-5555"
        />
      </fieldset>
      <fieldset>
        <!-- Password -->
        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="pwd" />
        <label for="pwd">Confirm Password:</label>
        <input type="password" id="pwd1" name="pwd1" />
        <!-- /^((?=\S*?[A-Z])(?=\S*?[a-z])(?=\S*?[0-9]).{6,})\S$/ -->
      </fieldset>
      <button type="submit">Create Account</button>
      <p>
        Already have an account?
        <a
          href="https://www.theodinproject.com/lessons/node-path-intermediate-html-and-css-sign-up-form"
          >Log in</a
        >
      </p>
    </form>
  </body>
</html>
